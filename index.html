<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>演示文稿 - shinerio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            color: #58a6ff;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #8b949e;
            margin-bottom: 2rem;
        }

        .presentation-list {
            list-style: none;
        }

        .presentation-item {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            transition: all 0.2s ease;
        }

        .presentation-item:hover {
            border-color: #58a6ff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(88, 166, 255, 0.1);
        }

        .presentation-link {
            color: #58a6ff;
            text-decoration: none;
            font-size: 1.25rem;
            font-weight: 600;
            display: block;
            margin-bottom: 0.5rem;
        }

        .presentation-link:hover {
            text-decoration: underline;
        }

        .presentation-desc {
            color: #8b949e;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .footer {
            margin-top: 3rem;
            color: #484f58;
            font-size: 0.85rem;
            text-align: center;
        }

        .footer a {
            color: #8b949e;
            text-decoration: none;
        }

        .footer a:hover {
            color: #58a6ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 演示文稿</h1>
        <p class="subtitle">shinerio 的在线演示文稿集合</p>

        <ul class="presentation-list">
            <li class="presentation-item">
                <a href="claude-code-java-lsp.html" class="presentation-link">
                    Claude Code Java L 指南
                </a>
                <p class="presentation-desc">
                    如何优雅地为 Claude Code 开启 Java 语言智能 - 包含 LSP 原理、安装配置指南和问题排查
                </p>
            </li>
        </ul>

        <div class="footer">
            <p>
                使用 GitHub Pages 托管 · 
                <a href="https://github.com/shinerio/shinerio-presentation">源码</a>
            </p>
        </div>
    </div>
</body>
</html>
