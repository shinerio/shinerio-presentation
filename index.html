<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>演示文稿 - shinerio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Allura&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #050505;
            --text: #f5f5f5;
            --muted: rgba(255,255,255,0.62);
            --line: rgba(255,255,255,0.12);
            --glass: rgba(255,255,255,0.08);
            --glass-strong: rgba(255,255,255,0.12);
            --shadow: 0 20px 60px rgba(0,0,0,0.32);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(255,255,255,0.08), transparent 28%),
                radial-gradient(circle at bottom right, rgba(255,255,255,0.05), transparent 32%),
                linear-gradient(180deg, #0a0a0a 0%, #050505 100%);
            padding: clamp(20px, 4vw, 48px);
        }

        .container {
            max-width: 980px;
            margin: 0 auto;
        }

        .hero {
            margin-bottom: clamp(28px, 4vw, 44px);
        }

        .hero-title {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        h1 {
            font-size: clamp(2rem, 5vw, 4.2rem);
            line-height: 0.95;
            letter-spacing: -0.06em;
            font-weight: 800;
            white-space: nowrap;
        }

        .hero-signature {
            align-self: flex-end;
            margin-top: -0.15rem;
            font-family: 'Allura', cursive;
            font-size: clamp(1.5rem, 3vw, 2.5rem);
            color: rgba(255,255,255,0.78);
            line-height: 1;
            transform: rotate(-4deg);
            text-shadow: 0 4px 18px rgba(255,255,255,0.08);
            padding-right: clamp(6px, 1vw, 12px);
        }

        .presentation-list {
            list-style: none;
            display: grid;
            gap: 16px;
        }

        .presentation-item {
            list-style: none;
        }

        .presentation-card {
            display: block;
            width: 100%;
            text-decoration: none;
            color: inherit;
            border: 1px solid var(--line);
            border-radius: 24px;
            background: linear-gradient(180deg, var(--glass-strong), var(--glass));
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: var(--shadow);
            padding: clamp(18px, 2.4vw, 28px);
            transition: transform 0.22s ease, border-color 0.22s ease, background 0.22s ease;
            position: relative;
            overflow: hidden;
        }

        .presentation-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.08), transparent 42%);
            pointer-events: none;
        }

        .presentation-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255,255,255,0.24);
            background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.09));
        }

        .presentation-title {
            font-size: clamp(1.08rem, 2vw, 1.35rem);
            font-weight: 700;
            line-height: 1.3;
            letter-spacing: -0.02em;
            margin-bottom: 0.55rem;
        }

        .presentation-desc {
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.65;
            margin-bottom: 0.85rem;
        }

        .presentation-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .presentation-path {
            color: rgba(255,255,255,0.4);
            font-size: 0.82rem;
            word-break: break-all;
        }

        .presentation-arrow {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.8);
            white-space: nowrap;
        }

        .footer {
            margin-top: 40px;
            color: rgba(255,255,255,0.4);
            font-size: 0.9rem;
            text-align: center;
        }

        .footer a {
            color: rgba(255,255,255,0.76);
            text-decoration: none;
        }

        .footer a:hover { text-decoration: underline; }

        @media (max-width: 640px) {
            body { padding: 18px; }
            .presentation-meta { align-items: flex-start; }
            .hero-signature { transform: rotate(-2deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <section class="hero">
            <div class="hero-title">
                <h1>Personal Presentations</h1>
                <div class="hero-signature">by shinerio</div>
            </div>
        </section>
        <ul class="presentation-list">
            <li class="presentation-item">
                <a href="claude-code-java-lsp-pastel-geometry.html" class="presentation-card">
                    <div class="presentation-title">claude code java lsp pastel geometry</div>
                    <p class="presentation-desc">演示文稿文件：claude-code-java-lsp-pastel-geometry.html</p>
                    <div class="presentation-meta">
                        <div class="presentation-path">/shinerio-presentation/claude-code-java-lsp-pastel-geometry.html</div>
                        <div class="presentation-arrow">打开演示 ↗</div>
                    </div>
                </a>
            </li>
        </ul>
        <div class="footer">
            GitHub Pages 自动发布 · <a href="https://github.com/shinerio/shinerio-presentation">查看源码仓库</a>
        </div>
    </div>
</body>
</html>
