<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style Preview A - Electric Studio</</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --bg-white: #ffffff;
            --accent-blue: #4361ee;
            --text-dark: #0a0a0a;
            --text-light: #ffffff;
            --title-size: clamp(1.75rem, 5vw, 3.5rem);
            --slide-padding: clamp(1.5rem, 4vw, 4rem);
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            font-family: 'Manrope', sans-serif;
            background: var(--bg-dark);
            overflow-x: hidden;
        }
        .slide {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .panel-top {
            height: 55%;
            background: var(--bg-white);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .panel-bottom {
            flex: 1;
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .accent-bar {
            position: absolute;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--accent-blue);
        }
        .brand-mark {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 2px solid var(--bg-dark);
            border-radius: 50%;
        }
top-left: 24px;
            left: 24px;
        }
        h1 {
            font-size: var(--title-size);
            font-weight: 800;
            color: var(--text-dark);
            line-height: 1.1;
            text-align: center;
            max-width: 800px;
        }
        .subtitle {
            font-size: clamp(1rem, 2vw, 1.5rem);
            font-weight: 500;
            color: var(--text-light);
            margin-top: var(--slide-padding);
            text-align: center;
            max-width: 600px;
            opacity: 0.8;
        }
        .style-badge {
            position: absolute;
            bottom: 32px;
            right: 32px;
            background: var(--accent-blue);
            color: white;
            padding: 8px 20px;
            border-radius: 4px;
            font-size: 0.875rem;
            font-weight: 600;
        }
        .corner-number {
            position: absolute;
            top: 32px;
            right: 32px;
            font-size: 5rem;
            font-weight: 800;
            color: var(--accent-blue);
            opacity: 0.1;
            line-height: 1;
        }
    </style>
</head>
<body>
    <section class="slide">
        <div class="panel-top">
            <div class="accent-bar"></div>
            <div class="corner-number">01</div>
            <h1>Claude Code<br>Java LSP 指南</h1>
        </div>
        <div class="panel-bottom">
            <p class="subtitle">如何优雅地为 Claude Code 开启 Java 语言智能</p>
            <div class="style-badge">Electric Studio</div>
        </div>
    </section>
</body>
</html>
