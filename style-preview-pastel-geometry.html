<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style Preview C - Pastel Geometry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #c8d9e6;
            --card-bg: #faf9f7;
            --text-dark: #1a1a1a;
            --pill-pink: #f0b4d4;
            --pill-mint: #a8d4c4;
            --pill-sage: #5a7c6a;
            --pill-lavender: #9b8dc4;
            --pill-violet: #7c6aad;
            --title-size: clamp(1.75rem, 5vw, 3.5rem);
            --slide-padding: clamp(2rem, 5vw, 5rem);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-primary);
            overflow-x: hidden;
        }
        .slide {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: var(--slide-padding);
        }
        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: clamp(2.5rem, 6vw, 5rem);
            max-width: 900px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            position: relative;
        }
        .pill-container {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .pill {
            width: 8px;
            border-radius: 4px;
        }
        .pill:nth-child(1) { height: 40px; background: var(--pill-sage); }
        .pill:nth-child(2) { height: 64px; background: var(--pill-lavender); }
        .pill:nth-child(3) { height: 96px; background: var(--pill-mint); }
        .pill:nth-child(4) { height: 64px; background: var(--pill-violet); }
        .pill:nth-child(5) { height: 40px; background: var(--pill-pink); }
        .number-badge {
            position: absolute;
            top: -20px;
            left: 32px;
            background: var(--pill-mint);
            color: white;
            font-weight: 700;
            font-size: clamp(0.875rem, 1.5vw, 1rem);
            padding: 8px 20px;
            border-radius: 20px;
        }
        h1 {
            font-size: var(--title-size);
            font-weight: 800;
            color: var(--text-dark);
            line-height: 1.1;
            margin-bottom: clamp(1rem, 2vw, 1.5rem);
        }
        .subtitle {
            font-size: clamp(1rem, 1.8vw, 1.3rem);
            font-weight: 400;
            color: var(--text-dark);
            opacity: 0.65;
            line-height: 1.6;
        }
        .divider {
            margin-top: var(--slide-padding);
            width: 100px;
            height: 3px;
            background: var(--pill-lavender);
            border-radius: 2px;
        }
        .icon-mark {
            position: absolute;
            bottom: 24px;
            right: 24px;
            width: 32px;
            height: 32px;
            background: var(--pill-pink);
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <section class="slide">
        <div class="card">
            <div class="number-badge">01</div>
            <div class="pill-container">
                <div class="pill"></div>
                <div class="pill"></div>
                <div class="pill"></div>
                <div class="pill"></div>
                <div class="pill"></div>
            </div>
            <h1>Claude Code<br>Java LSP 指南</h1>
            <p class="subtitle">如何优雅地为 Claude Code 开启 Java 语言智能</p>
            <div class="divider"></div>
            <div class="icon-mark"></div>
        </div>
    </section>
</body>
</html>
